# Independent WorkflowPulse product on playground server (142.93.213.101).
# Subdomain: pulse.conversely.in -> proxies to port 3200
#
# Enable with:
#   cp deploy/nginx-workflowpulse-independent.conf /etc/nginx/sites-available/pulse.conversely.in
#   ln -sf /etc/nginx/sites-available/pulse.conversely.in /etc/nginx/sites-enabled/pulse.conversely.in
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d pulse.conversely.in

server {
    listen 80;
    listen [::]:80;
    server_name pulse.conversely.in;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
